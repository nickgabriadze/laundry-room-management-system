query ListMachines
@auth(
  level: USER
  insecureReason: "All signed-in students may view shared machine status."
) {
  machines {
    id
    type
    dormBuilding
  }
}

query ListMachinesByBuilding($dormBuilding: DormBuilding!)
@auth(
  level: USER
  insecureReason: "All signed-in students may view shared machine status."
) {
  machines(where: { dormBuilding: { eq: $dormBuilding } }) {
    id
    type
    dormBuilding
    activeSessions: laundryActivities_on_machine(limit: 1) {
      id
    }
  }
}

query GetMyUserAccount @auth(level: USER) {
  userAccount(key: { uid_expr: "auth.uid" }) {
    uid
    email
    dormBuilding
    buildingUpdatedAt
  }
}

mutation CreateMyUserAccount($dormBuilding: DormBuilding!) @auth(level: USER) {
  userAccount_insert(
    data: {
      uid_expr: "auth.uid"
      email_expr: "auth.token.email"
      dormBuilding: $dormBuilding
    }
  )
}

mutation UpdateMyBuilding($dormBuilding: DormBuilding!) @auth(level: USER) {
  userAccount_update(
    first: {
      where: {
        _and: [
          { uid: { eq_expr: "auth.uid" } }
          {
            _or: [
              { buildingUpdatedAt: { isNull: true } }
              {
                buildingUpdatedAt: { lt_time: { now: true, sub: { days: 30 } } }
              }
            ]
          }
        ]
      }
    }
    data: {
      dormBuilding: $dormBuilding
      buildingUpdatedAt_expr: "request.time"
    }
  )
}
