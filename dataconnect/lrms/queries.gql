query ListMachines
@auth(
  level: USER
  insecureReason: "All signed-in students may view shared machine status."
) {
  machines {
    id
    type
    dormBuilding
  }
}

query ListMachinesByBuilding($dormBuilding: DormBuilding!)
@auth(
  level: USER
  insecureReason: "All signed-in students may view shared machine status."
) {
  machines(where: { dormBuilding: { eq: $dormBuilding } }) {
    id
    machineCode
    type
    dormBuilding
    activeSessions: laundryActivities_on_machine(
      where: { endsAt: { gt_time: { now: true } } }
      limit: 1
    ) {
      id
      endsAt
    }
  }
}

query GetMyActiveMachineSession($machineId: UUID!) @auth(level: USER) {
  laundryActivities(
    where: {
      machineId: { eq: $machineId }
      userUid: { eq_expr: "auth.uid" }
      endsAt: { gt_time: { now: true } }
    }
    limit: 1
  ) {
    id
    endsAt
  }
}

query GetMyUserAccount @auth(level: USER) {
  userAccount(key: { uid_expr: "auth.uid" }) {
    uid
    email
    dormBuilding
    buildingUpdatedAt
  }
}

mutation CreateMyUserAccount($dormBuilding: DormBuilding!) @auth(level: USER) {
  userAccount_insert(
    data: {
      uid_expr: "auth.uid"
      email_expr: "auth.token.email"
      dormBuilding: $dormBuilding
    }
  )
}

mutation UpdateMyBuilding($dormBuilding: DormBuilding!) @auth(level: USER) {
  userAccount_update(
    first: {
      where: {
        _and: [
          { uid: { eq_expr: "auth.uid" } }
          {
            _or: [
              { buildingUpdatedAt: { isNull: true } }
              {
                buildingUpdatedAt: { lt_time: { now: true, sub: { days: 30 } } }
              }
            ]
          }
        ]
      }
    }
    data: {
      dormBuilding: $dormBuilding
      buildingUpdatedAt_expr: "request.time"
    }
  )
}

mutation OccupyMachine($machineId: UUID!, $endsAt: Timestamp!)
  @auth(expr: "auth != null && auth.token.firebase.sign_in_provider != 'anonymous' && vars.endsAt > request.time")
  @transaction {
  query @redact {
    machine(key: { id: $machineId })
      @check(expr: "this != null", message: "This machine is unavailable.")
      @check(
        expr: "this.type != 'WASHER' || vars.endsAt - request.time <= duration('7200s')"
        message: "Washer sessions cannot exceed 120 minutes."
      ) {
      type
    }
    userAccount(key: { uid_expr: "auth.uid" })
      @check(expr: "this != null", message: "Complete your profile first.") {
      dormBuilding
    }
    laundryActivities(
      where: {
        machineId: { eq: $machineId }
        endsAt: { gt_time: { now: true } }
      }
    ) @check(expr: "this.size() == 0", message: "This machine is already in use.") {
      id
    }
  }
  machine_update(
    first: {
      where: {
        _and: [
          { id: { eq: $machineId } }
          { dormBuilding: { eq_expr: "response.query.userAccount.dormBuilding" } }
          {
            _or: [
              { occupiedUntil: { isNull: true } }
              { occupiedUntil: { lt_time: { now: true } } }
            ]
          }
        ]
      }
    }
    data: { occupiedUntil: $endsAt }
  ) @check(expr: "this != null", message: "This machine is already in use.")
  laundryActivity_insert(data: {
    id_expr: "uuidV4()"
    machineId: $machineId
    userUid_expr: "auth.uid"
    endsAt: $endsAt
  })
}

mutation ForceCancelMyMachineSession($machineId: UUID!)
  @auth(expr: "auth != null && auth.token.firebase.sign_in_provider != 'anonymous'")
  @transaction {
  laundryActivity_update(
    first: {
      where: {
        _and: [
          { machineId: { eq: $machineId } }
          { userUid: { eq_expr: "auth.uid" } }
          { endsAt: { gt_time: { now: true } } }
        ]
      }
    }
    data: {
      endsAt_expr: "request.time"
      wasForceCancelled: true
    }
  ) @check(expr: "this != null", message: "You don't have an active session on this machine.")
  machine_update(
    first: {
      where: {
        id: { eq: $machineId }
        occupiedUntil: { gt_time: { now: true } }
      }
    }
    data: { occupiedUntil: null }
  ) @check(expr: "this != null", message: "This machine is no longer occupied.")
}
